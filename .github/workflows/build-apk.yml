name: Build Android APK (Türkiye Mülk İmparatoru)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Install Capacitor CLI & Android Platform
        run: |
          npm install --no-save @capacitor/cli @capacitor/android @capacitor/assets
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android icons & splash screens from icon.png
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/splash.png
          cp icon.png assets/splash-dark.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A' --splashBackgroundColorDark '#0F172A'

      - name: Patch AndroidManifest.xml (Landscape lock, permissions & Google OAuth deep link)
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");

            // 1. Force sensorLandscape orientation on MainActivity
            if (!xml.includes("android:screenOrientation")) {
              xml = xml.replace(
                /<activity([^>]*android:name="\.MainActivity"[^>]*)>/,
                `<activity$1 android:screenOrientation="sensorLandscape">`
              );
            } else {
              xml = xml.replace(
                /android:screenOrientation="[^"]*"/,
                `android:screenOrientation="sensorLandscape"`
              );
            }

            // 2. Ensure all forward-looking permissions exist
            const permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CAMERA"
            ];
            for (const perm of permissions) {
              if (!xml.includes(perm)) {
                xml = xml.replace(
                  /<application/,
                  `    <uses-permission android:name="${perm}" />\n\n    <application`
                );
              }
            }

            // 3. Add Google OAuth deep link intent-filter (com.fugames.turkiyemulkimparatoru://login-callback)
            if (!xml.includes("com.fugames.turkiyemulkimparatoru")) {
              const deepLinkFilter = `
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="com.fugames.turkiyemulkimparatoru" android:host="login-callback" />
            </intent-filter>
        </activity>`;
              xml = xml.replace(/<\/activity>/, deepLinkFilter);
            }

            fs.writeFileSync(manifestPath, xml, "utf8");
            console.log("AndroidManifest.xml patched successfully.");
          '

      - name: Configure offline fallback in MainActivity when remote server is unreachable
        run: |
          npx cap copy android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkiye-mulk-imparatoru-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
