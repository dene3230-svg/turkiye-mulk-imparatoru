name: Build Android APK (Türkiye Mülk İmparatoru)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Install Capacitor CLI & Android Platform
        run: npm install --no-save --legacy-peer-deps @capacitor/cli @capacitor/android @capacitor/assets

      - name: Add and sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch AndroidManifest.xml (Landscape lock, permissions & Google OAuth deep link)
        run: node scripts/patch-android.js

      - name: Generate Android icons & splash screens from icon.png
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/splash.png
            cp icon.png assets/splash-dark.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A' --splashBackgroundColorDark '#0F172A'
          fi

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkiye-mulk-imparatoru-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
